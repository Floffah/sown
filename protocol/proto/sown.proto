syntax = "proto3";

package sown.protocol.v1;

// naming convention:
// - message names are stream + sender + purpose in pascal case - sender is always who will send it

// -- COMMON TYPES --

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Transform {
  Vector3 translation = 1;
  Quaternion rotation = 2;
  Vector3 scale = 3;
}

// -- STREAM INDEPENDANT --

enum StreamID {
  CONTROL = 0;
  EVENTS = 1;
}

message StreamHeader {
  StreamID stream_id = 1;
}

// -- RELIABLE STREAM 1: CONTROL --

message ControlClientHello {
  uint32 protocol_version = 1;
}

message ControlServerWelcome {
  uint32 protocol_version = 1;
}

message ControlServerError {
  reserved 1;
  reserved "error_id";
  string message = 2;
}

message ControlEnvelope {
  oneof payload {
    ControlClientHello client_hello = 1;
    ControlServerWelcome server_welcome = 2;
    ControlServerError server_error = 3;
  }
}

// -- RELIABLE STREAM 2: EVENTS --

message EventPlaceholderMessage {
  uint32 protocol_version = 1;
}

message EventEnvelope {
  oneof payload {
    EventPlaceholderMessage placeholder = 1;
  }
}

// -- UNRELIABLE DATAGRAMS --

message DatagramClientLocalPlayerMove {
  Transform transform = 1;
}

message DatagramEnvelope {
  oneof payload {
    DatagramClientLocalPlayerMove local_player_move = 1;
  }
}